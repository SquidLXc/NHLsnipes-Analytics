kind = "web"
previewPath = "/"
title = "NHLsnipes"
description = "A production-minded NHL analytics terminal for matchup analysis, player edges, props, goalie environments, team vulnerability, and transparent model audit history."
version = "1.0.0"
id = "artifacts/nhlsnipes"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23191

[services.development]
run = "pnpm --filter @workspace/nhlsnipes run dev"

[services.production]
build = [ "pnpm", "run", "build:production" ]

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs" ]

[services.production.run.env]
PORT = "23191"
NODE_ENV = "production"
SERVE_FRONTEND = "true"
NHLSNIPES_SYNC_INTERVAL_MS = "900000"

[services.env]
PORT = "23191"
BASE_PATH = "/"
